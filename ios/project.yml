name: OrderPulse
options:
  bundleIdPrefix: com.baodishan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: zh-Hans
targets:
  OrderPulse:
    type: application
    platform: iOS
    sources:
      - path: OrderPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baodishan.orderpulse
        PRODUCT_NAME: OrderPulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OrderPulse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: OrderPulse/OrderPulse.entitlements
      properties:
        aps-environment: development
  OrderPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrderPulseTests
    dependencies:
      - target: OrderPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baodishan.orderpulse.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OrderPulse:
    build:
      targets:
        OrderPulse: all
        OrderPulseTests: [test]
    test:
      targets:
        - OrderPulseTests
